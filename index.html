<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5e VTT 虛擬跑團平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- Supabase JS CDN (UMD 格式，確保全域變數可安全讀取) -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .grid-tile { transition: all 0.2s ease; }
        .grid-tile:hover { background-color: rgba(239, 68, 68, 0.2); }
        .proficient-dot { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col m-0 p-0">

    <!-- 全域頂部導航欄 (語言切換) -->
    <header class="bg-slate-950 p-4 border-b border-slate-800 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🎲</span>
            <h1 class="text-xl font-bold tracking-wider text-red-500 font-serif">D&D 5e VTT Sandbox</h1>
        </div>
        <button id="btn-lang" class="bg-slate-800 hover:bg-slate-700 px-4 py-1.5 rounded text-sm font-medium border border-slate-700 transition">
            切換語言 / Switch En
        </button>
    </header>

    <!-- 主內容容器 -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 overflow-y-auto">

        <!-- ==================== 1. 登入 / 註冊介面 ==================== -->
        <section id="pane-auth" class="w-full max-w-md bg-slate-950 p-8 rounded-xl border border-slate-800 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <h2 id="t-auth-title" class="text-2xl font-bold font-serif text-slate-200">冒險者旅店</h2>
                <p id="t-auth-subtitle" class="text-sm text-slate-400">登入您的神祕檔案以開啟漫遊</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label id="l-email" class="block text-xs uppercase tracking-wider font-semibold text-slate-400 mb-1">電子信箱 / Email</label>
                    <input type="email" id="auth-email" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-red-500" placeholder="your@email.com">
                </div>
                <div>
                    <label id="l-pass" class="block text-xs uppercase tracking-wider font-semibold text-slate-400 mb-1">暗號密碼 / Password</label>
                    <input type="password" id="auth-password" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-red-500" placeholder="••••••••">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 pt-2">
                <button id="btn-login" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded transition cursor-pointer">雲端登入</button>
                <button id="btn-register" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2 rounded border border-slate-600 transition cursor-pointer">雲端註冊</button>
            </div>

            <div class="relative flex py-2 items-center text-xs text-slate-500 uppercase">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="mx-3" id="t-or">或者 / OR</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <button id="btn-sandbox" class="w-full bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 font-semibold py-2.5 rounded border border-amber-500/30 transition cursor-pointer">
                🚀 管理員免註冊通道 (純前端沙盒)
            </button>
        </section>


        <!-- ==================== 2. 選角控制台 ==================== -->
        <section id="pane-dashboard" class="hidden w-full max-w-4xl bg-slate-950 p-6 rounded-xl border border-slate-800 shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <div>
                    <h2 id="t-dash-title" class="text-2xl font-bold text-amber-500 font-serif">英雄選角控制台</h2>
                    <p id="t-dash-subtitle" class="text-xs text-slate-400">配置您的核心屬性與技能熟練度</p>
                </div>
                <button id="btn-dash-logout" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-slate-300">登出角色</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 六大屬性欄 -->
                <div class="md:col-span-2 grid grid-cols-3 gap-4" id="ability-scores-container">
                    <!-- 屬性卡片會由 JS 自動生成，包含：力量、敏捷、體質、智力、智慧、魅力 -->
                </div>

                <!-- 技能與職業特色 -->
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-800 space-y-4">
                    <h3 id="t-skills-title" class="text-sm font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2">特定技能檢定 (熟練)</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded border border-slate-800">
                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full proficient-dot"></span>
                                <span class="font-medium text-sm" id="k-persuasion">說服 (Persuasion)</span>
                            </div>
                            <button id="btn-roll-persuasion" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 text-xs px-2.5 py-1 rounded border border-red-500/30 transition">🎲 檢定</button>
                        </div>
                        <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded border border-slate-800">
                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full proficient-dot"></span>
                                <span class="font-medium text-sm" id="k-performance">表演 (Performance)</span>
                            </div>
                            <button id="btn-roll-performance" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 text-xs px-2.5 py-1 rounded border border-red-500/30 transition">🎲 檢定</button>
                        </div>
                    </div>

                    <div class="pt-2">
                        <div class="text-xs text-slate-400" id="t-prof-bonus">熟練加值 (Proficiency Bonus): <span class="text-red-400 font-bold">+2</span></div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button id="btn-enter-game" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-8 py-3 rounded-lg shadow-lg text-lg transition tracking-wide cursor-pointer">
                    ⚔️ 進入地下城世界 / Enter Game
                </button>
            </div>
        </section>


        <!-- ==================== 3. 遊玩主介面 ==================== -->
        <section id="pane-game" class="hidden w-full max-w-6xl flex flex-col lg:flex-row gap-6 h-[75vh]">
            <!-- 左側：戰棋地圖與狀態欄 -->
            <div class="flex-1 bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-4">
                        <h3 class="font-bold text-md text-red-400 font-serif" id="t-map-title">戰術網格 (8x8)</h3>
                        <span class="text-xs text-slate-400" id="t-map-tip">點擊空格移動棋子</span>
                    </div>
                    <!-- 法術位與長休 -->
                    <div class="flex items-center gap-3 bg-slate-900 px-3 py-1.5 rounded border border-slate-800">
                        <span class="text-xs font-semibold uppercase text-slate-400" id="t-slots-label">1環法術位:</span>
                        <div class="flex gap-1" id="spell-slots-row">
                            <span class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_6px_#3b82f6] cursor-pointer slot-dot" data-idx="0"></span>
                            <span class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_6px_#3b82f6] cursor-pointer slot-dot" data-idx="1"></span>
                        </div>
                        <button id="btn-long-rest" class="bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-400 text-xs px-2.5 py-0.5 rounded border border-emerald-500/30 transition ml-2">⛺ 長休</button>
                    </div>
                </div>

                <!-- 8x8 戰棋格子 -->
                <div class="flex-1 bg-slate-900 border border-slate-800 rounded-lg p-2 grid grid-cols-8 grid-rows-8 gap-1 aspect-square max-h-[50vh] mx-auto w-full" id="board-grid">
                    <!-- 由 JavaScript 自動動態渲染 64 個格子 -->
                </div>
            </div>

            <!-- 右側：背包、投骰日誌控制台 -->
            <div class="w-full lg:w-80 bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col justify-between space-y-4">
                <!-- 吟遊詩人裝備背包 -->
                <div class="flex-1 flex flex-col min-h-[200px]">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2 mb-2" id="t-bag-title">吟遊詩人起始背包 (Bard Pack)</h3>
                    <ul class="space-y-1.5 text-sm overflow-y-auto flex-1 pr-1" id="bag-items-list">
                        <!-- 由 JS 渲染中英雙語裝備清單 -->
                    </ul>
                </div>

                <!-- 擲骰歷史日誌 -->
                <div class="flex-1 flex flex-col min-h-[220px]">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400" id="t-log-title">一鍵擲骰日誌</h3>
                        <button id="btn-clear-log" class="text-[10px] text-slate-500 hover:text-slate-300">清除</button>
